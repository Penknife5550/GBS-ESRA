# =============================================================================
# GBS Campus — Docker Compose (Produktion, hinter dem gemeinsamen Caddy)
#
# Gleiches Muster wie das CREDO HR-Portal: KEIN eigener Reverse Proxy im Stack.
# TLS und die Weiterleitung uebernimmt der bereits laufende Caddy auf dem
# Server; er erreicht die App ueber das externe Docker-Netz `reverse_proxy`.
# Den passenden Caddy-Block liefert Caddyfile.gbs-campus.
#
# Start:  docker compose up -d --build
# Stack:  app (Next.js) · worker (Erinnerungen/Aufraeumen) · db (PostgreSQL 16)
#         · backup (naechtlicher pg_dump)
#
# Voraussetzung auf dem Server (einmalig, existiert schon fuer das HR-Portal):
#   docker network create reverse_proxy
#
# Netze:
#   reverse_proxy — extern, gehoert dem Caddy. Nur die App haengt daran.
#   data          — internal: true, kein Internet, kein Port nach aussen.
#                   Die Datenbank haengt ausschliesslich hier.
#   ausgang       — normales Bridge-Netz nur fuer den Worker, damit er die
#                   Erinnerungs-Mails per SMTP verschicken kann, ohne am
#                   Caddy-Netz zu haengen.
#
# Fuer einen Server OHNE Caddy (eigener Traefik auf 80/443) gibt es weiterhin
# docker-compose.traefik.yml:  docker compose -f docker-compose.traefik.yml up -d
# =============================================================================

# Fester Projektname: Volumes heissen damit immer gbs-campus_pgdata usw. —
# unabhaengig davon, in welchen Ordner das Repo auf dem Server geklont wird.
# Ein anderer Ordnername ergaebe sonst eine LEERE neue Datenbank.
name: gbs-campus

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gbs-campus:latest
    container_name: gbs-app
    restart: unless-stopped
    # Speichergrenze: Ohne sie holt sich der OOM-Killer im Zweifel die Datenbank
    # statt der Anwendung (siehe UEBERGABE.md).
    mem_limit: 768m
    environment:
      - TZ=Europe/Berlin
      - NODE_ENV=production
      # DATABASE_URL = Eigentuemer (Migration, Setup gbs_app, Seed im Entrypoint).
      # Mit gesetztem APP_DB_PASSWORD schaltet der Server danach auf gbs_app um
      # (siehe docker/entrypoint.sh). Ueberschreibt eine DATABASE_URL aus der .env.
      - DATABASE_URL=postgresql://gbs:${DB_PASSWORD}@db:5432/gbs_campus?schema=public
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-}
      - APP_DATABASE_URL=postgresql://gbs_app:${APP_DB_PASSWORD:-}@db:5432/gbs_campus?schema=public
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - reverse_proxy
      - data
    # Kein Port-Mapping — die App ist ausschliesslich ueber Caddy erreichbar
    # (Caddyfile: reverse_proxy gbs-app:3000).

  # Worker: Ueberleitungs-Erinnerungen T-14/-7/-3 und DSGVO-Aufraeumlauf,
  # stuendlich und idempotent. Gleiches Image wie die App, anderer Einstieg.
  worker:
    image: gbs-campus:latest
    # Das Image baut der Dienst `app` — nie aus einer Registry ziehen wollen.
    pull_policy: never
    container_name: gbs-worker
    restart: unless-stopped
    mem_limit: 256m
    entrypoint: ["node", "worker.js"]
    environment:
      - TZ=Europe/Berlin
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gbs:${DB_PASSWORD}@db:5432/gbs_campus?schema=public
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # Bewusst KEIN depends_on auf app: Der Worker wartet selbst auf das Schema.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/gbs-worker-lebenszeichen -mmin -130 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 15m
    networks:
      - data
      - ausgang

  db:
    image: postgres:16-alpine
    container_name: gbs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gbs_campus
      POSTGRES_USER: gbs
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbs -d gbs_campus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
    # Kein Port-Mapping, kein Internetzugang.

  backup:
    image: postgres:16-alpine
    container_name: gbs-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_AUFBEWAHRUNG_TAGE: ${BACKUP_AUFBEWAHRUNG_TAGE:-60}
      TZ: Europe/Berlin
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      # Wie beim HR-Portal als Ordner neben der docker-compose.yml — so liegen
      # die Dumps sichtbar auf dem Host und lassen sich einfach wegkopieren.
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

volumes:
  pgdata:

networks:
  reverse_proxy:
    external: true
  data:
    internal: true
  ausgang:
